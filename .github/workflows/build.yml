# Tests à chaque push et Pull Request vers dev ou main.
# Publication d'une version (installateur + empreinte SHA-256) quand on pousse un tag vX.Y.Z sur main.
name: build

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test

  release:
    # Seulement pour un tag « v* », et seulement si les tests passent.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    # Nécessaire pour que « gh release create » puisse créer la release avec le GITHUB_TOKEN.
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version à partir du tag
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Tag inattendu : $env:TAG (format vX.Y.Z)" }
          "VERSION=$($env:TAG.Substring(1))" >> $env:GITHUB_ENV

      - name: Publication (Pointage.exe autonome)
        run: dotnet publish src/Pointage -c Release -o publish "-p:Version=$env:VERSION"

      - name: Installateur
        run: |
          choco install innosetup -y
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DMyAppVersion=$env:VERSION" "/DSourceDir=$PWD\publish" installer/Pointage.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc a échoué ($LASTEXITCODE)" }
          Copy-Item installer/Output/Pointage-Setup.exe .

      - name: Empreinte SHA-256
        run: |
          # Texte ASCII brut, sans BOM (le « > » de Windows PowerShell écrirait de l'UTF-16 et casserait la vérification).
          $hash = (Get-FileHash Pointage-Setup.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD\Pointage-Setup.exe.sha256", "$hash  Pointage-Setup.exe`n", [Text.Encoding]::ASCII)

      - name: Création de la release
        run: gh release create $env:TAG Pointage-Setup.exe Pointage-Setup.exe.sha256 --generate-notes
